<style>
   /* generic selectors (input, .interactive, .fallback, .content, .slider, .thumbnail) are scoped to .car1-wrap
      (class on the block's outer td) so they don't leak into other blocks, e.g. input_* or accordion_* */
   .car1-wrap input {
      display: none;
   }

   .car-slide-wrap {
      display: none;
      position: relative;
   }

   /* show the wrap (image + arrows together) for the active radio */
   input:checked+.car-slide-wrap {
      display: block;
   }

   /* show the content block that follows the wrap */
   input:checked+.car-slide-wrap+.content {
      display: block;
   }

   .car1-wrap .slider {
      width: 100%;
      max-width: 600px;
      display: block;
   }

   .car1-wrap .thumbnail {
      display: inline-block;
   }

   .car1-wrap .thumbnail img {
      width: 150px;
      height: auto;
      margin: 0 2px;
   }

   .car1-wrap .interactive {
      display: none;
   }

   .car1-wrap input:checked+div.fallback {
      display: none;
   }

   .car1-wrap input:checked+div.fallback+div.interactive {
      display: block;
   }

   .car1-wrap .content {
      padding: 20px 0;
      display: none;
   }

   /* arrows */
   .car-ltn,
   .car-rtn {
      z-index: 100;
      display: block;
      width: 15%;
      height: 100%;
      position: absolute;
      background-color: transparent;
      top: 0;
      cursor: pointer;
   }

   .car-ltn {
      left: 0;
   }

   .car-rtn {
      right: 0;
   }

   .car-ltn::after,
   .car-rtn::after {
      content: '';
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      position: absolute;
      top: 50%;
      margin-top: -9px;
      -webkit-filter: drop-shadow(1px 1.5px 1px rgba(0, 0, 0, .5));
   }

   .car-ltn::after {
      border-right: 9px solid #ffffff;
      left: 10px;
   }

   .car-rtn::after {
      border-left: 9px solid #ffffff;
      right: 10px;
   }

   @-webkit-keyframes quiver {
      0% {
         -webkit-transform: translateX(0);
      }

      5% {
         -webkit-transform: translateX(-4px);
      }

      10% {
         -webkit-transform: translateX(4px);
      }

      15% {
         -webkit-transform: translateX(-3px);
      }

      20% {
         -webkit-transform: translateX(3px);
      }

      25% {
         -webkit-transform: translateX(-2px);
      }

      30% {
         -webkit-transform: translateX(2px);
      }

      35% {
         -webkit-transform: translateX(0);
      }

      100% {
         -webkit-transform: translateX(0);
      }
   }


   .car-ltn::after,
   .car-rtn::after {
      -webkit-animation: quiver 3s ease 1s 3 both;
      animation: quiver 3s ease 1s 3 both;
   }


   @media screen and (max-width: 600px) {
      .car1-wrap .thumbnail img {
         width: 90px;
         height: auto;
      }
   }
</style>
